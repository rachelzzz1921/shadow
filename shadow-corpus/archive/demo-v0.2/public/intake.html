<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Shadow｜另一条路的你</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="intake-theme.css">
</head>
<body>
  <div class="intake-bg" aria-hidden="true"></div>

  <div class="intake-app">
    <header class="intake-header">
      <div class="intake-brand">
        <h1 translate="no">Shadow</h1>
        <p>平行人生 · 信息采集</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <a href="/" class="intake-btn ghost" style="text-decoration:none;display:inline-flex;align-items:center;padding:0 14px;min-height:36px">← 返回 Demo</a>
        <span class="intake-badge">INTAKE</span>
      </div>
    </header>

    <button type="button" id="scenarioCapsule" class="intake-scenario-capsule intake-hidden" aria-live="polite">📍 还在理解…</button>
    <div id="scenarioPopover" class="intake-scenario-popover intake-hidden"></div>

    <div class="intake-main">
      <section class="intake-panel" id="mainPanel">
        <nav id="stepChips" class="intake-step-nav" aria-label="步骤"></nav>

        <div id="stepLayerA">
          <h2 class="intake-section-title">另一条路</h2>
          <p class="intake-section-sub">不是表单，是第一次自我审视。把岔路口说具体，影子才接得住。</p>

          <div id="exampleCards" class="intake-examples"></div>

          <div class="intake-field">
            <label for="choiceInput">岔路口抉择 <span style="color:var(--rose)">*</span></label>
            <textarea id="choiceInput" rows="3" placeholder="如果当年我没有出国，而是留在成都做住院医师"></textarea>
            <p class="intake-hint">试试「如果当年我______，而不是______」</p>
            <div id="choiceRing" class="intake-char-ring">
              <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(247,242,223,0.12)" stroke-width="3"/><circle data-prog cx="18" cy="18" r="14" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-dasharray="0 88" stroke-linecap="round"/></svg>
              <span data-label>0/120</span>
            </div>
          </div>

          <div class="intake-field">
            <label for="descInput">岔路口前后，你在怕什么、又在拼命想要什么？</label>
            <textarea id="descInput" rows="4" placeholder="我习惯用成绩证明自己，但每次靠近目标又会怀疑自己是不是真的想要它"></textarea>
            <div id="descRing" class="intake-char-ring">
              <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(247,242,223,0.12)" stroke-width="3"/><circle data-prog cx="18" cy="18" r="14" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-dasharray="0 88" stroke-linecap="round"/></svg>
              <span data-label>0/200</span>
            </div>
            <p id="descNudge" class="intake-nudge intake-hidden">那时候，最让你睡不着的是什么？</p>
          </div>

          <div class="intake-field">
            <label for="oneLinerInput">最像你的一句话（选填）</label>
            <input id="oneLinerInput" type="text" placeholder="再撑一下，撑过去就好了" maxlength="80">
          </div>

          <div class="intake-time-row">
            <div class="intake-field" style="margin:0">
              <label for="birthYear">出生年份</label>
              <select id="birthYear">
                <script>
                  for (let y = 2010; y >= 1970; y--) {
                    document.write(`<option value="${y}"${y === 2001 ? ' selected' : ''}>${y}</option>`);
                  }
                </script>
              </select>
            </div>
            <div class="intake-field" style="margin:0">
              <label for="forkYear">岔路口年份</label>
              <select id="forkYear">
                <script>
                  for (let y = 2026; y >= 2006; y--) {
                    document.write(`<option value="${y}"${y === 2019 ? ' selected' : ''}>${y}</option>`);
                  }
                </script>
              </select>
            </div>
            <div class="intake-field" style="margin:0">
              <label for="ageAtFork">当时年龄</label>
              <input id="ageAtFork" type="number" min="12" max="90" value="18">
            </div>
          </div>
        </div>

        <div id="stepLayerB" class="intake-hidden">
          <h2 class="intake-section-title">那时的你</h2>
          <p class="intake-section-sub">选几个词就好。影子需要重点，不需要全部。</p>
          <div id="tagCategories"></div>
        </div>

        <div id="stepLayerC" class="intake-hidden">
          <div id="qSectionChips" class="intake-q-progress"></div>
          <p id="qProgress" class="intake-q-meta"></p>
          <h2 id="qTitle" class="intake-q-title"></h2>
          <p id="qSub" class="intake-q-sub"></p>
          <p id="qNote" class="intake-q-meta"></p>
          <div id="qRenderer"></div>
        </div>

        <div id="stepConfirm" class="intake-hidden">
          <h2 class="intake-section-title">Agent 会怎么读你</h2>
          <p class="intake-section-sub">确认后进入七年生成。你可以返回修改任何一步。</p>
          <div id="confirmSummary"></div>
        </div>
      </section>

      <aside class="intake-panel intake-preview-panel">
        <p class="intake-preview-title">影子初读</p>
        <div id="previewBody" class="intake-preview-body">影子还在听你说话——选几个词，或把岔路口说具体一点。</div>
        <p class="intake-preview-foot">这只是初步印象，不是最终 Persona。真正的影子会在七年里慢慢看清你。</p>
      </aside>
    </div>

    <footer class="intake-footer">
      <button type="button" id="btnBack" class="intake-btn ghost" disabled>上一步</button>
      <button type="button" id="btnNext" class="intake-btn primary">继续</button>
    </footer>
  </div>

  <script src="scenario-classify-client.js"></script>
  <script src="intake-questions.js"></script>
  <script src="intake-app.js"></script>
</body>
</html>
