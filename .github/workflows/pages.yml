name: Deploy team board to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'shadow-corpus/06-task-progress/tasks/registry.json'
      - 'shadow-corpus/06-task-progress/site.config.json'
      - 'shadow-corpus/06-task-progress/site.board.json'
      - 'shadow-corpus/06-task-progress/scripts/**'
      - 'shadow-corpus/visual/scenes/fuxduxian/draft/**'
      - 'shadow-corpus/visual/registry/packs/**'
      - 'shadow-corpus/tooling/scripts/build-visual-demo-pack.mjs'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build board site
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node shadow-corpus/tooling/scripts/build-visual-demo-pack.mjs
          node shadow-corpus/06-task-progress/scripts/shadow-tasks.js sync
          node shadow-corpus/06-task-progress/scripts/build-board-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
