<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow · Phaser Layout 预览（V-007）</title>
  <link rel="stylesheet" href="demo-theme.css">
  <style>
    body { margin: 0; background: #0a0a12; color: #ccc; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    .bar { display: flex; gap: 10px; padding: 14px 16px; align-items: center; flex-wrap: wrap; }
    .bar button { padding: 8px 14px; cursor: pointer; background: #1a1a28; color: #ddd; border: 1px solid #444; font-size: 14px; }
    .bar button.active { border-color: #c9a227; color: #ffe9b0; }
    #game-mount { width: 640px; max-width: 100%; margin: 0 auto; }
    .hint { padding: 0 16px 16px; font-size: 14px; color: #888; line-height: 1.5; }
    a { color: #8af; font-size: 14px; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>复读线 layout</strong>
    <span id="pack-badge" style="color:#8a9;font-size:14px"></span>
    <span id="year-btns"></span>
    <a href="demo.html">← 静态叙事 demo</a>
    <a href="?legacy=1" style="font-size:14px;color:#888">legacy 占位</a>
  </div>
  <p id="visual-anchor" style="padding:0 16px 8px;margin:0;font-size:14px;color:#aaa;max-width:720px;line-height:1.5"></p>
  <div id="game-mount"></div>
  <p class="hint">fuxduxian-v1 draft · PX-FDX-* · CC0 纹理预览 · <a href="?legacy=1">legacy</a></p>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
  if (typeof Phaser === 'undefined') {
    document.write('<script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"><\\/script>');
  }
  </script>
  <script src="demo-phaser-v1.js"></script>
</body>
</html>
