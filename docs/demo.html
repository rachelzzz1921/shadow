<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>影子 · 如影 — 平行人生</title>
<meta name="description" content="读一条七年平行人生，或在关键转折处改写影子的下一步。" />
<link rel="stylesheet" href="demo-theme.css?v=20260615a" />
<link rel="stylesheet" href="demo-scenarios.css" />
<link rel="stylesheet" href="demo-ui-polish.css" />
<link rel="stylesheet" href="demo-ui-polish-r2.css" />
<link rel="stylesheet" href="demo-ui-polish-r3.css" />
<link rel="stylesheet" href="demo-hero-visual.css" />
</head>
<body>

<script>
(function hubRedirectBareDemo() {
  var p = new URLSearchParams(location.search);
  if (p.get('story') || p.get('live') === '1' || p.get('from') === 'intake' || p.get('from') === 'generate' || p.get('skipLanding') === '1') return;
  try {
    if (sessionStorage.getItem('shadow_intake_story_id') || sessionStorage.getItem('shadow_live_session')) return;
  } catch (_) { /* ignore */ }
  window.location.replace('index.html#stories');
})();
</script>

<a class="skip-demo" href="#btn-start">跳过装饰，进入内容</a>
<p id="boot-error" hidden></p>
<noscript><p style="position:fixed;inset:16px;z-index:999;padding:12px;background:#fff3e0;border:2px solid #c8863a;">需要启用 JavaScript 才能阅读影子的七年。</p></noscript>

<div id="crt-overlay" aria-hidden="true"></div>
<div id="ambient-particles" aria-hidden="true"></div>
<div id="demo-live-loading" class="demo-live-loading" hidden role="status" aria-live="polite">
  <p>正在加载你的七年…</p>
  <div class="demo-live-loading-bar"><span></span></div>
</div>

<button type="button" id="nav-back">← 返回</button>
<div id="page-indicator"></div>
<button type="button" class="nav-arrow" id="nav-prev" aria-label="上一页">‹</button>
<button type="button" class="nav-arrow" id="nav-next" aria-label="下一页">›</button>
<div id="nav-hint-bar" aria-hidden="true">← 方向键翻页 · 顶部圆点跳年 →</div>
<div id="page-announcer" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="viewport">
  <div id="slider">
    <div class="page" id="p-landing">
      <div class="landing-title enter-item"><span class="zpix-xxl">Shadow</span></div>
      <div class="landing-subtitle enter-item"><span class="zpix-xl">如 影</span></div>
      <div class="landing-tagline enter-item">平行人生 · 选择故事线</div>
      <div class="story-picker enter-item" id="story-picker" aria-label="选择故事线"></div>
      <div class="scenario-legend enter-item" id="scenario-legend" aria-label="人生主题"></div>

      <div class="profile-teaser snes enter-item" id="profile-teaser"></div>

      <button type="button" class="btn-start enter-item" id="btn-start">进入影子的七年</button>
      <p class="landing-intake enter-item" style="margin-top:14px;font-size:14px;color:var(--ink-muted)">
        <a href="generate.html" style="color:var(--amber);text-decoration:none;font-weight:600">写一条属于我自己的七年</a>
      </p>
      <div class="year-preview enter-item" id="year-dots-landing"></div>

      <p class="landing-foot enter-item"><a href="pitch.html" style="color:var(--amber)">走近影子</a> · <a href="index.html" style="color:var(--amber)">首页</a> · <a href="generate.html" style="color:var(--amber)">写我的七年</a></p>
    </div>
  </div>
</div>

<!-- Pivotal 介入 -->
<div id="intervention-modal" hidden>
  <div class="intervention-card snes modal-cutin" role="dialog" aria-modal="true" aria-labelledby="intervention-question">
    <div class="intervention-label">关键转折</div>
    <p id="intervention-question"></p>
    <div id="intervention-options"></div>
    <p class="intervention-hint">你的选择会影响之后的故事走向。也可以跳过，让影子自己走。</p>
    <button type="button" id="intervention-skip">跳过</button>
  </div>
</div>

<!-- Shadow 对话 -->
<div id="dialog-overlay" hidden>
  <div class="dlg-box snes modal-cutin">
    <div class="dlg-nametag" id="dlg-name">影 · 阿岚</div>
    <div class="dlg-year-ctx" id="dlg-ctx"></div>
    <div class="dlg-text-area snes-inset"><div id="dlg-thread" class="dlg-thread" aria-live="polite"></div></div>
    <div id="dlg-suggest" class="dlg-suggest" hidden></div>
    <form id="dialog-form" class="dlg-form" hidden>
      <input id="dialog-input" type="text" maxlength="80" placeholder="问影子一句话…" autocomplete="off" />
      <button type="submit" id="dialog-send">发送</button>
    </form>
    <p class="dlg-cite" id="dlg-cite" hidden></p>
    <div class="dlg-footer">
      <span class="dlg-status" id="dlg-status">▼ 正在讲述...</span>
      <button type="button" class="btn-dlg-close" id="btn-dlg-close">跳过</button>
    </div>
  </div>
</div>

<script>
(function markSkipLandingEarly() {
  var p = new URLSearchParams(location.search);
  if (p.get('from') === 'intake' || p.get('from') === 'generate' || p.get('live') === '1' || p.get('skipLanding') === '1') {
    document.documentElement.classList.add('skip-landing-boot');
    return;
  }
  try {
    if (sessionStorage.getItem('shadow_intake_story_id')) {
      document.documentElement.classList.add('skip-landing-boot');
    }
  } catch (_) { /* ignore */ }
})();
</script>
<script src="shadow-api-prefix.js"></script>
<script src="demo-scenarios.js"></script>
<script src="demo-story-visuals.js"></script>
<script src="demo-gender-sprites.js"></script>
<script src="demo-data.js?v=20260615b"></script>
<script src="demo-stories.js"></script>
<script src="demo-visual.js"></script>
<script src="demo-scene-textures.js"></script>
<script src="demo-universal-assets.js"></script>
<script src="demo-extended-assets.js"></script>
<script src="demo-transitions.js"></script>
<script src="demo-audio.js"></script>
<script src="demo-engine.js?v=20260615b"></script>
<script>
document.documentElement.classList.add('js-ready');
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot-error');
  if (b) {
    b.hidden = false;
    b.textContent = '加载失败：' + (e.message || '未知错误') + '。请返回首页重试。';
  }
});

(async function bootDemo() {
  try {
    await window.ShadowStories.bootstrapDemoStory();
    window.ShadowStories.renderStoryPicker('story-picker');
    window.ShadowDemoEngine.init();
  } catch (err) {
    var b = document.getElementById('boot-error');
    if (b) {
      b.hidden = false;
      b.textContent = '故事加载失败：' + (err.message || err);
    }
  }
})();
</script>
</body>
</html>
